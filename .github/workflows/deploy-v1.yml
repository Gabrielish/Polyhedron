name: Deploy Polyhedron PWA

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "scripts/build-pwa-*.mjs"
      - "scripts/verify-pwa-*.cjs"
      - ".github/workflows/deploy-v1.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
      VITE_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build PWA
        run: pnpm run pwa:build
      - name: Verify companion
        run: node scripts/verify-pwa-companion.cjs && node scripts/verify-pwa-landing.cjs && node scripts/verify-pwa-search.cjs && node scripts/verify-pwa-dialogue.cjs && node scripts/verify-pwa-legal.cjs
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: pwa/dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
