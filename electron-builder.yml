appId: com.polyhedron.bg3-mod-translator
productName: Polyhedron
afterPack: scripts/prepare-installer-runtime.cjs
copyright: Copyright © 2026 Gabrielish
publish:
  provider: github
  owner: Gabrielish
  repo: Polyhedron
  releaseType: release
directories:
  buildResources: build
extraResources:
  - from: build/google-drive/google-drive-credentials.json
    to: google-drive/google-drive-credentials.json
  - from: data/dialogue-metadata-cache.json
    to: dialogue-metadata-cache.json
files:
  - package.json
  - out/**
  - drizzle/**
  - tools/**
  - work/pak/**
  - reference/imported-translations/**
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,CHANGELOG.md,README.md,PLANNING.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  - '!bkp/**'
  - '!work/pak/Localization/English/english.loca'
  - '!tools/google-drive/**'
  - '!**/google-drive-token*'
  - '!**/google-drive-credentials.json'
  - '!**/*.db'
  - '!**/*.db-*'
  - '!**/*.pws'
  - '!**/.env*'
asarUnpack:
  - drizzle/**
  - tools/**
  - work/pak/**
  # napi-rs native binding for lz4-napi (pak compression). Its .node lives in a
  # platform-specific package that must sit on the real filesystem - dlopen can't read
  # it from inside app.asar. '**/*.node' also covers any future native dependency.
  - '**/*.node'
  - node_modules/@antoniomuso/**
win:
  executableName: Polyhedron
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
  requestedExecutionLevel: asInvoker
nsis:
  artifactName: ${productName}-${version}-windows-${arch}-setup.${ext}
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/installerSidebar.bmp
  installerHeader: build/installerHeader.bmp
  include: build/installer.nsh
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  runAfterFinish: false
  deleteAppDataOnUninstall: false
mac:
  icon: build/icon.icns
  # This is a local, unsigned build. Keeping identity null prevents a
  # partially-signed app/framework bundle and Team ID mismatch on macOS.
  identity: null
  target:
    - target: dmg
      arch:
        - arm64
    - target: zip
      arch:
        - arm64
  artifactName: ${productName}-${version}-${arch}.${ext}
npmRebuild: true
dmg:
  title: ${productName} ${version}
  icon: build/icon.icns
  background: build/dmg-background.png
  iconSize: 96
  iconTextSize: 12
  window:
    x: 620
    y: 435
    width: 680
    height: 330
  contents:
    - x: 174
      y: 116
      type: file
    - x: 506
      y: 116
      type: link
      path: /Applications
